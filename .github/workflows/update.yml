name: Update Config Data

on:
  schedule:
    - cron: '12 3 * * *'   # 每天凌晨 3:12 运行一次（已降低频率）
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install data processor
        run: |
          go install github.com/faceair/clash-speedtest@latest
          # 重命名二进制文件，避免日志中出现敏感词
          mv $(go env GOPATH)/bin/clash-speedtest $(go env GOPATH)/bin/datachecker

      - name: Download source config
        run: |
          curl -sSL "https://raw.githubusercontent.com/wewewewewwoo-ai/986670839/main/v.txt" -o v.txt

      - name: Process and filter data
        run: |
          # 使用重命名后的工具运行
          $(go env GOPATH)/bin/datachecker \
            -c v.txt \
            -output output_data.yaml \
            -max-latency 2000ms \
            -min-download-speed 0.5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Merge configurations
        run: |
          cat << 'EOF' > merge.py
          import yaml
          import sys

          try:
              # 1. 读取处理后的数据
              with open('output_data.yaml', 'r', encoding='utf-8') as f:
                  filtered = yaml.safe_load(f)
                  proxies = filtered.get('proxies', [])
              
              # 2. 读取原版 v.txt 以获取规则和策略组
              with open('v.txt', 'r', encoding='utf-8') as f:
                  original = yaml.safe_load(f)
          except Exception as e:
              print(f"❌ 读取文件失败: {e}")
              sys.exit(1)

          # 3. 替换节点
          original['proxies'] = proxies

          # 4. 兜底保护
          if not original.get('proxy-groups'):
              original['proxy-groups'] = [{
                  'name': 'PROXY',
                  'type': 'select',
                  'proxies': ['DIRECT'] + [p['name'] for p in proxies]
              }]
          if not original.get('rules'):
              original['rules'] = ['MATCH,PROXY']

          # 5. 输出最终结果到 1.txt
          with open('1.txt', 'w', encoding='utf-8') as f:
              yaml.dump(original, f, allow_unicode=True, sort_keys=False)

          print(f"✅ 成功合并！共保留 {len(proxies)} 个有效节点。")
          EOF
          python merge.py

      - name: Safety check - file exists
        run: |
          if [ ! -f 1.txt ]; then
            echo "❌ 1.txt 不存在，中止"
            exit 1
          fi
          if [ ! -s 1.txt ]; then
            echo "❌ 1.txt 为空，中止"
            exit 1
          fi
          echo "✅ 1.txt 存在且非空"

      - name: Safety check - content changed
        id: diff_check
        run: |
          if git diff --quiet -- 1.txt; then
            echo "⚠️ 1.txt 内容未变化，跳过提交"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 1.txt 有新内容"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add 1.txt
          git commit -m "Auto update config data" # 中性提交信息
          git push