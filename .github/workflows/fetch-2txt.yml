name: Fetch config

on:
  # 定时运行（每 6 小时一次，可按需修改）
  schedule:
    - cron: '0 */6 * * *'
  # 支持手动触发
  workflow_dispatch:
  # 每次 push 也跑一次（可选，不需要可删掉）
  push:
    branches: [ main ]

# 必须赋予写权限，才能把文件推回仓库
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download file as 2.txt
        run: |
          # URL 中的 @ 编码为 %40 更稳妥
          URL="https://sub.danhu.dpdns.org/paste/26HappyMAF-TG%40FProxies/clash"
          curl -fsSL --retry 3 --retry-delay 5 "$URL" -o 2.txt
          echo "=== File head ==="
          head -n 5 2.txt
          echo "=== Size ==="
          wc -c 2.txt

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 2.txt

          if git diff --cached --quiet; then
            echo "No changes, skip commit."
            exit 0
          fi

          git commit -m "chore: update 2.txt ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

          # 避免远程有更新时 push 失败
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push